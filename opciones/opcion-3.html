<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Opción 3: Abismo Paralaje</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&display=swap');
        body, html { margin: 0; padding: 0; background-color: #000; color: #FF1F1F; font-family: 'Archivo', sans-serif; }
        
        .parallax-wrapper { height: 100vh; overflow-x: hidden; overflow-y: auto; perspective: 1px; }
        .parallax-group { position: relative; height: 100vh; display: flex; justify-content: center; align-items: center; transform-style: preserve-3d; }
        
        .parallax-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            transform: translateZ(-1px) scale(2); z-index: -1;
            opacity: 0.3; mix-blend-mode: multiply; filter: sepia(1) hue-rotate(-50deg) saturate(3);
        }
        .bg-1 { background-image: url('../assets/fotos/foto4.jpg'); }
        .bg-2 { background-image: url('../assets/fotos/foto2.jpg'); }
        
        .content { position: relative; z-index: 1; text-align: center; }
        h1 { font-size: 6rem; background-color: rgba(0,0,0,0.6); padding: 0 20px; border-radius: 10px; }
        .spacer { height: 50vh; background: #050000; display: flex; align-items: center; justify-content: center; z-index: 2; position: relative; }
    </style>
</head>
<body>
    <div class="parallax-wrapper">
        <div class="parallax-group">
            <div class="parallax-bg bg-1"></div>
            <div class="content"><h1>MULTITUD</h1></div>
        </div>
        <div class="spacer"><h2>EL HUMO Y EL ESTRUENDO</h2></div>
        <div class="parallax-group">
            <div class="parallax-bg bg-2"></div>
            <div class="content"><h1>BASE</h1></div>
        </div>
    </div>
</body>
</html>
