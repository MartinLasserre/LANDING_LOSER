<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Opción 2: Destellos al Hover</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&display=swap');
        body, html {
            margin: 0; padding: 0; background-color: #020000; color: #FF1F1F;
            font-family: 'Archivo', sans-serif; overflow-x: hidden;
        }
        .fondo-humo {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: linear-gradient(45deg, #1a0000, #000000);
        }
        .content { padding: 10vh 5vw; max-width: 1200px; margin: 0 auto; text-align: center; }
        .section { height: 60vh; display: flex; justify-content: center; align-items: center; }
        h1 { font-size: 5rem; cursor: pointer; transition: text-shadow 0.3s; position: relative; z-index: 2; }
        h1:hover { text-shadow: 0 0 30px rgba(255, 31, 31, 0.8); }
        
        .destello-img {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60%; opacity: 0; mix-blend-mode: color-dodge; transition: opacity 0.4s ease, filter 0.4s;
            pointer-events: none; z-index: 1; filter: contrast(150%) brightness(0.8);
        }
        .section:hover .destello-img { opacity: 0.5; filter: contrast(120%) brightness(1.2); }
    </style>
</head>
<body>
    <div class="fondo-humo"></div>
    <div class="content">
        <div class="section">
            <img src="../assets/fotos/foto1.jpg" class="destello-img">
            <h1>LA BANDA</h1>
        </div>
        <div class="section">
            <img src="../assets/fotos/foto2.jpg" class="destello-img">
            <h1>EL RUIDO</h1>
        </div>
    </div>
</body>
</html>
