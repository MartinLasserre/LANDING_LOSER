<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Marco 1: Brutalismo Desfasado</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&display=swap');
        body, html { margin: 0; padding: 0; background-color: #050000; color: #FF1F1F; font-family: 'Archivo', sans-serif; overflow-x: hidden; }
        .fondo-humo { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle, #2a0000, #000000); z-index: -1; }
        .content { padding: 10vh 5vw; max-width: 800px; margin: 0 auto; text-align: center; }
        
        .marco-brutal {
            display: inline-block;
            margin: 50px 0;
            position: relative;
            border: 2px solid #FF1F1F;
            box-shadow: 15px 15px 0px rgba(255, 31, 31, 0.3), -5px -5px 20px rgba(0,0,0,0.8);
            transition: transform 0.3s;
        }
        .marco-brutal img {
            display: block;
            max-width: 100%;
            filter: contrast(120%) grayscale(20%) sepia(50%) hue-rotate(-50deg);
        }
    </style>
</head>
<body>
    <div class="fondo-humo"></div>
    <div class="content">
        <h1>ESCUCHANOS</h1>
        <div class="marco-brutal">
            <img src="../assets/fotos/foto3.jpg" alt="Foto">
        </div>
        <p>Un encuadre crudo, de líneas duras y sombras agresivas.</p>
    </div>
</body>
</html>
