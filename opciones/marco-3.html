<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Marco 3: Fisura Glitch</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&display=swap');
        body, html { margin: 0; padding: 0; background-color: #030000; color: #FF1F1F; font-family: 'Archivo', sans-serif; overflow-x: hidden; }
        .fondo-humo { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: -1; }
        .content { padding: 10vh 5vw; max-width: 800px; margin: 0 auto; text-align: center; }
        
        .marco-glitch {
            display: inline-block;
            margin: 50px 0;
            position: relative;
            /* Cortes diagonales simulando foto rota */
            clip-path: polygon(2% 0, 100% 0, 98% 100%, 0 100%);
            border-left: 3px solid #FF1F1F;
            border-right: 1px solid rgba(255, 31, 31, 0.5);
            padding: 5px;
            background: rgba(255, 31, 31, 0.05);
        }
        .marco-glitch::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            box-shadow: inset 0 0 20px #FF1F1F;
            mix-blend-mode: overlay;
            pointer-events: none;
        }
        .marco-glitch img {
            display: block;
            max-width: 100%;
            filter: contrast(130%) brightness(0.9);
        }
    </style>
</head>
<body>
    <div class="fondo-humo"></div>
    <div class="content">
        <h1>CONTACTO</h1>
        <div class="marco-glitch">
            <img src="../assets/fotos/foto4.jpg" alt="Foto">
        </div>
        <p>Bordes cortados de manera irregular, enmarcado por líneas finas rojas vibrantes.</p>
    </div>
</body>
</html>
