<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Opción 4: Ecos Subliminales</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&display=swap');
        body, html {
            margin: 0; padding: 0; background-color: #030000; color: #FF1F1F;
            font-family: 'Archivo', sans-serif; overflow: hidden; height: 100vh;
        }
        .fondo-humo {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #200000, #000000); z-index: -2;
        }
        .texto-central {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 4rem; z-index: 10; text-align: center; text-shadow: 2px 2px 10px #000;
        }
        .eco-img {
            position: absolute; opacity: 0; mix-blend-mode: overlay; filter: saturate(2) brightness(0.7);
            transition: opacity 0.5s ease-in-out; pointer-events: none; z-index: -1;
        }
    </style>
</head>
<body>
    <div class="fondo-humo"></div>
    <div class="texto-central">
        <h1>PRESENCIA VITAL</h1>
        <p>Están pero no están</p>
    </div>
    
    <script>
        const fotos = ['foto0.jpg', 'foto1.jpg', 'foto2.jpg', 'foto3.jpg', 'foto4.jpg'];
        
        function crearEco() {
            const img = document.createElement('img');
            img.src = '../assets/fotos/' + fotos[Math.floor(Math.random() * fotos.length)];
            img.className = 'eco-img';
            
            const size = Math.random() * 30 + 30; // 30vw to 60vw
            img.style.width = size + 'vw';
            img.style.left = (Math.random() * 100 - size/2) + 'vw';
            img.style.top = (Math.random() * 100 - size/2) + 'vh';
            
            document.body.appendChild(img);
            
            setTimeout(() => img.style.opacity = '0.3', 50);
            setTimeout(() => {
                img.style.opacity = '0';
                setTimeout(() => img.remove(), 500);
            }, 1000 + Math.random() * 2000); // 1s a 3s visible
        }

        setInterval(crearEco, 1500);
    </script>
</body>
</html>
